<div class="phone-trigger-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Phone Trigger</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="pp-settings-block">
                <label>
                    <input id="pp_enabled" type="checkbox" />
                    <span>Enable</span>
                </label>
            </div>
            <div class="pp-settings-block">
                <label>
                    <input id="pp_show_fab" type="checkbox" />
                    <span>Floating button</span>
                </label>
            </div>
            <div class="pp-settings-block">
                <label>
                    <input id="pp_wand" type="checkbox" />
                    <span>Extensions menu item</span>
                </label>
            </div>
            <div class="pp-settings-block">
                <label>
                    <input id="pp_slash" type="checkbox" />
                    <span>Slash commands</span>
                </label>
            </div>
            <div class="pp-settings-block">
                <label>
                    <input id="pp_sound" type="checkbox" />
                    <span>Sounds</span>
                </label>
            </div>
            <div class="pp-settings-block">
                <label>
                    <input id="pp_inject" type="checkbox" />
                    <span>Inject mail prompt</span>
                </label>
            </div>
            <div class="pp-settings-block">
                <label>
                    <input id="pp_auto_open" type="checkbox" />
                    <span>Open phone on new mail</span>
                </label>
            </div>
            <div class="pp-settings-block">
                <label>
                    <input id="pp_notify_toast" type="checkbox" />
                    <span>Toast on new mail</span>
                </label>
            </div>

            <div class="pp-settings-block">
                <label for="pp_position"><span>FAB position</span></label>
                <select id="pp_position">
                    <option value="right">Right</option>
                    <option value="left">Left</option>
                    <option value="center">Center</option>
                </select>
            </div>

            <hr />
            <div class="pp-settings-block">
                <label for="pp_mail_backend"><span>Mail generation</span></label>
                <select id="pp_mail_backend">
                    <option value="main">Main LLM / API</option>
                    <option value="openrouter">OpenRouter</option>
                </select>
            </div>
            <div class="pp-settings-block pp-openrouter-only">
                <label for="pp_or_key"><span>OpenRouter API key</span></label>
                <input id="pp_or_key" type="password" class="text_pole" autocomplete="off" spellcheck="false" />
            </div>
            <div class="pp-settings-block pp-openrouter-only">
                <label for="pp_or_model"><span>OpenRouter model</span></label>
                <input id="pp_or_model" type="text" class="text_pole" placeholder="openai/gpt-4o-mini" />
            </div>

            <div class="pp-settings-block">
                <button id="pp_open_phone_btn" class="menu_button" type="button">Open phone</button>
                <button id="pp_test_mail_btn" class="menu_button" type="button">Test mail</button>
            </div>

            <hr />
            <p class="pp-settings-block">
                <code>/phone</code> · <code>/mail</code> · <code>/mailsend subject=…</code> ·
                <code>send_email</code> tool · <code>&lt;email&gt;</code> tags
            </p>
        </div>
    </div>
</div>
